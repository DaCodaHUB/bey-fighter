; CI-only presets. ci/build.sh copies these into the runner's checkout.
[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
export_filter="all_resources"
include_filter=""
exclude_filter="screenshots/*,ci/*,build/*,*.keystore,*.jks,*.idsig"
export_path="build/windows/BladeGamblers.exe"
script_export_mode=2

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
debug/export_console_wrapper=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false
application/export_angle=0
application/export_d3d12=0

[preset.1]
name="Android"
platform="Android"
export_filter="all_resources"
include_filter=""
exclude_filter="screenshots/*,ci/*,build/*,*.keystore,*.jks,*.idsig"
export_path="build/android/BladeGamblers-debug.apk"
script_export_mode=2

[preset.1.options]
gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="1.0-debug"
package/unique_name="com.example.bladegamblers"
package/name="Blade Gamblers"
package/signed=true
screen/immersive_mode=true
screen/edge_to_edge=false
